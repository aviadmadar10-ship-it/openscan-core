```yaml name: Build Android APK on: push: branches: [ "main" ] workflow_dispatch: jobs: build: runs-on: ubuntu-latest steps: - name: Checkout Repository uses: actions/checkout@v4 - name: Setup Java 17 uses: actions/setup-java@v4 with: distribution: 'zulu' java-version: '17' - name: Setup Flutter SDK uses: subosito/flutter-action@v2 with: flutter-version: '3.22.x' channel: 'stable' cache: true - name: Get Dependencies run: | flutter pub get - name: Build APK (Release) run: | flutter build apk --release --no-tree-shake-icons - name: Upload APK Artifact uses: actions/upload-artifact@v4 with: name: openscan3d-release-apk path: build/app/outputs/flutter-apk/app-release.apk ``
